<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8">
    
    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center mb-4">
        <span class="text-3xl">⚙️</span>
      </div>

      <h1 class="text-3xl font-bold text-white">
        Sistema WorkFlow
      </h1>

      <p class="text-slate-400 mt-2">
        Inicia sesión para continuar
      </p>
    </div>

    <form (ngSubmit)="login()" class="space-y-5">
      
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">
          Correo electrónico
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@workflow.com"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">
          Contraseña
        </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500"
        />
      </div>

      <div
        *ngIf="errorMessage"
        class="bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-xl px-4 py-3"
      >
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 disabled:opacity-60 disabled:cursor-not-allowed text-slate-950 font-semibold transition"
      >
        {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>
  </div>
</div>
