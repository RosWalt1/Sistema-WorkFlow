<aside class="h-screen w-72 bg-[#020617]/95 border-r border-cyan-400/20 text-white flex flex-col shadow-2xl shadow-cyan-500/10">
  <div class="p-6 border-b border-cyan-400/20">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-cyan-400 to-violet-600 flex items-center justify-center font-black text-xl">
        W
      </div>

      <div>
        <h1 class="text-xl font-extrabold tracking-wide">Workflow System</h1>
        
      </div>
    </div>
  </div>

  <div *ngIf="user" class="px-6 py-4 border-b border-cyan-400/10">
    <p class="text-sm font-semibold text-white">{{ user.nombre }}</p>
    <p class="text-xs text-slate-400 truncate">{{ user.email }}</p>
    <span class="inline-block mt-2 px-2 py-1 rounded-lg bg-cyan-500/10 border border-cyan-400/20 text-cyan-300 text-xs">
      {{ user.rol }}
    </span>
  </div>

  <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
    <a *ngFor="let item of menuItems"
       [routerLink]="item.route"
       routerLinkActive="bg-gradient-to-r from-cyan-500/20 to-violet-600/20 text-cyan-300 border border-cyan-400/30"
       class="block px-4 py-3 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 transition-all duration-200">
      {{ item.label }}
    </a>
  </nav>

  <div class="p-4 border-t border-cyan-400/20">
    <button
      type="button"
      (click)="logout()"
      class="w-full px-4 py-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 hover:bg-red-500/20 hover:text-red-200 transition-all duration-200 font-semibold">
      Cerrar sesión
    </button>
  </div>
</aside>
